name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - run: npm run zip --workspace plugin
      - uses: actions/upload-artifact@v7
        with:
          name: toss-place-mcp-plugin
          path: plugin/place-mcp-bridge.zip
          if-no-files-found: error
